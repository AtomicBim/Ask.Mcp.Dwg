[project]
name = "mcp-dwg-server"
version = "0.1.0"
description = "MCP Server: проверка проектной документации (PDF) из чата OpenWebUI"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.12.0,<2.0.0",
    "pymupdf>=1.24.10",
    "pillow>=10.3.0",
    "numpy>=1.26",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
    "starlette>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
